<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="VaultShield — Lock down your passwords with ironclad security." />
<title>VaultShield</title>
<link rel="stylesheet" href="https://db.onlinewebfonts.com/c/04e6981992c0e2e7642af2074ebe3901?family=Helvetica+Now+Display+Bold" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --font-heading:'Helvetica Now Display Bold', sans-serif;
    --font-body:'Inter', sans-serif;
    --color-text:#192837;
    --color-accent:#7342E2;
    --color-login-bg:#F2F2EE;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{min-height:100%;}
  body{font-family:var(--font-body);color:var(--color-text);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  img,svg{display:block;}

  .hero{position:relative;width:100%;min-height:100vh;min-height:100svh;overflow:hidden;}
  .bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

  /* navbar */
  .nav{position:relative;z-index:10;max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;}
  @media(min-width:640px){.nav{padding:20px 32px;}}
  .nav-links{display:none;align-items:center;gap:32px;}
  .nav-links a{font-size:14px;font-weight:500;opacity:.8;transition:opacity .2s;}
  .nav-links a:hover{opacity:1;}
  .nav-actions{display:none;align-items:center;gap:12px;}
  .btn{border:none;cursor:pointer;border-radius:9999px;font-family:var(--font-body);}
  .btn-primary{background:var(--color-accent);color:#fff;padding:10px 20px;font-size:14px;font-weight:600;transition:transform .2s;}
  .btn-primary:hover{transform:scale(1.03);}
  .btn-light{background:var(--color-login-bg);color:var(--color-text);padding:10px 20px;font-size:14px;font-weight:600;transition:transform .2s;}
  .btn-light:hover{transform:scale(1.03);}
  .hamburger{background:none;border:none;cursor:pointer;display:flex;color:#192837;}
  @media(min-width:768px){
    .nav-links{display:flex;}
    .nav-actions{display:flex;}
    .hamburger{display:none;}
  }

  /* hero content */
  .hero-content{position:relative;z-index:10;max-width:1280px;margin:0 auto;padding:clamp(40px,8vw,72px) 20px 0;}
  @media(min-width:640px){.hero-content{padding-left:32px;padding-right:32px;}}
  .hero-inner{max-width:560px;}
  .hero h1{font-family:var(--font-heading);font-size:clamp(1.65rem,5vw,3rem);line-height:1.05;letter-spacing:-.01em;color:#192837;margin-bottom:24px;}
  .hero h1 .ic{display:inline-block;vertical-align:middle;position:relative;top:-2px;color:#192837;}
  .hero p{font-family:var(--font-body);font-size:clamp(.9rem,2.5vw,1.1rem);line-height:1.65;opacity:.8;max-width:560px;}
  .cta{margin-top:32px;display:flex;align-items:center;justify-content:space-between;gap:32px;min-width:210px;background:#7342E2;color:#fff;border:none;cursor:pointer;border-radius:50px;padding:17px 24px;font-family:var(--font-body);font-weight:600;font-size:clamp(.9rem,2vw,1rem);box-shadow:0 4px 24px rgba(115,66,226,.28);transition:transform .15s ease, filter .15s ease;}
  .cta:hover{transform:scale(1.04);filter:brightness(1.1);}
  .cta:active{transform:scale(.96);}

  /* fade-up entrance */
  .fade-up{opacity:0;transform:translateY(28px);animation:fadeUp .6s cubic-bezier(.22,1,.36,1) forwards;}
  .d0{animation-delay:0s;}
  .d1{animation-delay:.15s;}
  .d2{animation-delay:.30s;}
  @keyframes fadeUp{to{opacity:1;transform:none;}}

  /* mobile menu sheet */
  .backdrop{position:fixed;inset:0;z-index:40;background:rgba(25,40,55,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;}
  .backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;right:0;top:0;z-index:50;display:flex;flex-direction:column;width:min(88vw,360px);height:100dvh;background:#CFC8C5;box-shadow:-12px 0 48px rgba(25,40,55,.18);transform:translateX(100%);transition:transform .45s cubic-bezier(.22,1,.36,1);}
  .sheet.open{transform:translateX(0);}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;}
  .sheet-head button{background:none;border:none;cursor:pointer;display:flex;color:#192837;}
  .divider{height:1px;background:rgba(25,40,55,.15);}
  .sheet-links{display:flex;flex-direction:column;gap:20px;padding:28px 24px;flex:1;}
  .sheet-links a{font-size:18px;font-weight:500;color:var(--color-text);opacity:0;transform:translateX(20px);}
  .sheet.open .sheet-links a{animation:slideIn .4s cubic-bezier(.22,1,.36,1) forwards;}
  .sheet.open .sheet-links a:nth-child(1){animation-delay:.18s;}
  .sheet.open .sheet-links a:nth-child(2){animation-delay:.25s;}
  .sheet.open .sheet-links a:nth-child(3){animation-delay:.32s;}
  .sheet.open .sheet-links a:nth-child(4){animation-delay:.39s;}
  .sheet.open .sheet-links a:nth-child(5){animation-delay:.46s;}
  @keyframes slideIn{to{opacity:1;transform:none;}}
  .sheet-cta{display:flex;flex-direction:column;gap:12px;padding:0 24px 32px;}
  .sheet-cta .btn{width:100%;padding:12px 20px;text-align:center;}
</style>
</head>
<body>
  <section class="hero">
    <video class="bg-video" autoplay muted loop playsinline
      src="https://d8j0ntlcm91z4.cloudfront.net/user_3EC0YGaHjvMLhYcZgnZm4yM618D/hf_20260726_002902_e83ed4b4-7e2c-40a6-9731-9fb816d9af42.mp4"></video>

    <nav class="nav">
      <a href="#" aria-label="VaultShield home">
        <svg width="32" height="32" fill="none" overflow="visible" viewBox="0 0 256 256" role="img" aria-label="VaultShield logo">
          <path d="M 64 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 L 128 64 L 128 64.5 L 161 32 L 192 0 L 256 0 L 256 64 L 192 128 L 128 128 L 128 192 L 96 223 L 63.5 256 L 0 256 L 0 192 Z M 256 192 L 224 223 L 191.5 256 L 128 256 L 128 192 L 192 128 L 256 128 Z" fill="#192837"/>
        </svg>
      </a>

      <div class="nav-links">
        <a href="#">Vault</a>
        <a href="#">Plans</a>
        <a href="#">Install</a>
        <a href="#">News</a>
        <a href="#">Help</a>
      </div>

      <div class="nav-actions">
        <button class="btn btn-primary">Start For Free</button>
        <button class="btn btn-light">Sign In</button>
      </div>

      <button class="hamburger" id="openMenu" aria-label="Open menu">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
      </button>
    </nav>

    <div class="hero-content">
      <div class="hero-inner">
        <h1 class="fade-up d0">
          <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          Lock Down Your Passwords
          <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
          with Ironclad Security
          <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0 1 8 4"/><path d="M5 19.5C5.5 18 6 15 6 12c0-.7.12-1.37.34-2"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M9 6.8a6 6 0 0 1 9 5.2c0 .47 0 1.17-.02 2"/></svg>
        </h1>

        <p class="fade-up d1">Zero stress, total control. VaultShield keeps you covered with unbreakable storage, one-tap access, and pro-grade tools for your non-stop world.</p>

        <button class="cta fade-up d2">
          Get It Free
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m12 16 4-4-4-4"/><path d="M8 12h8"/></svg>
        </button>
      </div>
    </div>
  </section>

  <div class="backdrop" id="backdrop"></div>

  <aside class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-head">
      <svg width="32" height="32" fill="none" overflow="visible" viewBox="0 0 256 256" role="img" aria-label="VaultShield logo">
        <path d="M 64 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 L 128 64 L 128 64.5 L 161 32 L 192 0 L 256 0 L 256 64 L 192 128 L 128 128 L 128 192 L 96 223 L 63.5 256 L 0 256 L 0 192 Z M 256 192 L 224 223 L 191.5 256 L 128 256 L 128 192 L 192 128 L 256 128 Z" fill="#192837"/>
      </svg>
      <button id="closeMenu" aria-label="Close menu">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="divider"></div>
    <div class="sheet-links">
      <a href="#">Vault</a>
      <a href="#">Plans</a>
      <a href="#">Install</a>
      <a href="#">News</a>
      <a href="#">Help</a>
    </div>
    <div class="sheet-cta">
      <button class="btn btn-primary">Start For Free</button>
      <button class="btn btn-light">Sign In</button>
    </div>
  </aside>

  <script>
    (function () {
      var openBtn = document.getElementById('openMenu');
      var closeBtn = document.getElementById('closeMenu');
      var sheet = document.getElementById('sheet');
      var backdrop = document.getElementById('backdrop');
      function open(){ sheet.classList.add('open'); backdrop.classList.add('open'); sheet.setAttribute('aria-hidden','false'); }
      function close(){ sheet.classList.remove('open'); backdrop.classList.remove('open'); sheet.setAttribute('aria-hidden','true'); }
      openBtn.addEventListener('click', open);
      closeBtn.addEventListener('click', close);
      backdrop.addEventListener('click', close);
    })();
  </script>
</body>
</html>
